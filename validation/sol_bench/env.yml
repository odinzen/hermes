# Environment for the Hermes validation MD on Sol (GPU). Versions match the local WSL venv the frozen rule names
# (Python 3.11, ASE 3.29.0, mace-torch 0.3.16, torch 2.14.1, cuEquivariance 0.12.0). Torch and the cuEquivariance
# kernels are their CUDA 12 builds, as Sol's A100 driver may be too old for the CUDA 13 builds used locally.
name: hermes-mace
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.4
  - scipy=1.17
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1+cu126
      - ase==3.29.0
      - mace-torch==0.3.16
      - e3nn==0.4.4
      - matscipy==1.3.0
      - opt_einsum==3.4.0
      - cuequivariance==0.12.0
      - cuequivariance-torch==0.12.0
      - cuequivariance-ops-torch-cu12==0.12.0
